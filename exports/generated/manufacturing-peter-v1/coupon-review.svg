<svg xmlns="http://www.w3.org/2000/svg" width="340mm" height="210mm" viewBox="0 0 340 210" data-authority="REVIEW_ONLY_NOT_FOR_CUTTING" data-package-sha256="e75d8bbfda0ad4035a7725f42e24bed5cf661bf408d6544718b7f87f36ddcbe8"><title>Supplier calibration coupon — face A only; never full-sheet release</title><metadata>CERN-OHL-S-2.0; Source Location: https://github.com/advpeterrobinson-hash/vpin-cabinet</metadata><g id="THROUGH" fill="none" stroke="#183d59" stroke-width="0.2"><rect id="BOARD" x="0" y="0" width="300" height="210" rx="4" /><rect id="FIT_KEY" x="315" y="0" width="25" height="25" rx="0" /><path id="SLOT_1" d="M 18 35 A 2 2 0 0 1 22 35 L 31.799999999999997 35 A 2 2 0 0 1 35.8 35 L 35.8 71 A 2 2 0 0 1 31.799999999999997 71 L 22 71 A 2 2 0 0 1 18 71 Z" /><path id="SLOT_2" d="M 61 35 A 2 2 0 0 1 65 35 L 74.9 35 A 2 2 0 0 1 78.9 35 L 78.9 71 A 2 2 0 0 1 74.9 71 L 65 71 A 2 2 0 0 1 61 71 Z" /><path id="SLOT_3" d="M 104 35 A 2 2 0 0 1 108 35 L 118.0 35 A 2 2 0 0 1 122.0 35 L 122.0 71 A 2 2 0 0 1 118.0 71 L 108 71 A 2 2 0 0 1 104 71 Z" /><path id="SLOT_4" d="M 147 35 A 2 2 0 0 1 151 35 L 161.1 35 A 2 2 0 0 1 165.1 35 L 165.1 71 A 2 2 0 0 1 161.1 71 L 151 71 A 2 2 0 0 1 147 71 Z" /><path id="SLOT_5" d="M 190 35 A 2 2 0 0 1 194 35 L 204.2 35 A 2 2 0 0 1 208.2 35 L 208.2 71 A 2 2 0 0 1 204.2 71 L 194 71 A 2 2 0 0 1 190 71 Z" /><path id="SLOT_6" d="M 233 35 A 2 2 0 0 1 237 35 L 247.3 35 A 2 2 0 0 1 251.3 35 L 251.3 71 A 2 2 0 0 1 247.3 71 L 237 71 A 2 2 0 0 1 233 71 Z" /></g><g id="POCKET_6" fill="none" stroke="#007c78" stroke-width="0.2"><rect id="R2_POCKET" x="18" y="106" width="30" height="30" rx="2" /><path id="TBONE_POCKET" d="M 75 106 A 2 2 0 0 1 79 106 L 101 106 A 2 2 0 0 1 105 106 L 105 136 A 2 2 0 0 1 101 136 L 79 136 A 2 2 0 0 1 75 136 Z" /></g><g id="LOCATOR_0_5" fill="none" stroke="#a04500" stroke-width="0.2"><circle id="PILOT_LOCATOR" cx="145.0" cy="120.0" r="2.0" /><circle id="SCREW_LOCATOR" cx="220.0" cy="120.0" r="2.0" /></g><g id="REVIEW_LABELS_NOT_MACHINING" fill="#183d59" font-family="sans-serif" font-size="3.4"><text x="10" y="11" font-size="5">REVIEW ONLY — NOT A CUTTING FILE</text><text x="10" y="19" font-size="3.4">FACE A | Ø4 / R2 | thickness 18 mm: NOMINAL ILLUSTRATION ONLY</text><text x="10" y="26" font-size="3.4">Clearance is TOTAL width allowance. Production coupon requires measured lot thickness.</text><text x="18" y="85" font-size="3.4">SLOT_1: -0.20</text><text x="18" y="91" font-size="3.4">width 17.80</text><text x="61" y="85" font-size="3.4">SLOT_2: -0.10</text><text x="61" y="91" font-size="3.4">width 17.90</text><text x="104" y="85" font-size="3.4">SLOT_3: +0.00</text><text x="104" y="91" font-size="3.4">width 18.00</text><text x="147" y="85" font-size="3.4">SLOT_4: +0.10</text><text x="147" y="91" font-size="3.4">width 18.10</text><text x="190" y="85" font-size="3.4">SLOT_5: +0.20</text><text x="190" y="91" font-size="3.4">width 18.20</text><text x="233" y="85" font-size="3.4">SLOT_6: +0.30</text><text x="233" y="91" font-size="3.4">width 18.30</text><text x="18" y="101" font-size="3.4">R2 unrelieved</text><text x="75" y="101" font-size="3.4">T-bone R2</text><text x="18" y="146" font-size="3.4">Both pockets 6 mm deep; compare square-key seating.</text><text x="130" y="108" font-size="3.4">Shallow locator</text><text x="199" y="108" font-size="3.4">Manual screw test</text><text x="130" y="133" font-size="3.4">Ø4 × 0.5 deep</text><text x="199" y="133" font-size="3.4">Selected pilot / CSK</text><text x="199" y="140" font-size="3.4">No cutter flip / no back-face CNC</text><text x="10" y="167" font-size="3.4">Use the same production plywood, machine, cutter and CAM process.</text><text x="10" y="175" font-size="3.4">Measure slots, pocket depth, R2, T-bone seating and pilot; record manual screw fit.</text><text x="10" y="183" font-size="3.4">Fit key: actual stock edge tests slots; square corner tests relief. Protect all fit edges.</text><text x="10" y="192" font-size="3.4">No full-sheet release before coupon acceptance and regeneration.</text><text x="10" y="202" font-size="3">CERN-OHL-S-2.0 | github.com/advpeterrobinson-hash/vpin-cabinet</text><text x="318" y="9" font-size="3.4">25 × 25</text><text x="318" y="16" font-size="3.4">FIT KEY</text><text x="317" y="33" font-size="3">15 mm gap</text></g></svg>