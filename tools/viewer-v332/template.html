rap:anywhere}dl{display:grid;grid-template-columns:1fr 1.4fr;gap:5px;margin:10px 0}dt{font-weight:650}dd{margin:0}#state-note{position:absolute;bottom:12px;left:12px;right:12px;max-width:750px;border:1px solid #bbc9d0;border-left:4px solid #20313c;background:#ffffffed;padding:10px 13px;pointer-events:none;font-size:12px}#mode-tag{position:absolute;left:12px;top:12px;background:#ffffffed;border-radius:5px;padding:7px 12px;max-width:calc(100% - 24px);font-weight:650;font-size:12px;pointer-events:none}#error{position:absolute;inset:60px 20px auto;background:#fff1dd;color:#8a2f1b;padding:20px}#manual-panel{position:absolute;z-index:3;right:12px;top:53px;width:min(420px,calc(100% - 24px));max-height:calc(100% - 165px);overflow:auto;background:#fffffff5;border:1px solid #aabec9;border-radius:8px;padding:15px;box-shadow:0 8px 30px #20313c25}#manual-panel h2{margin-top:0}#manual-panel h3{font-size:14px}#manual-panel .checkpoint{border-left:4px solid #20313c;background:#e8eff3;padding:10px}.badge{display:inline-block;border:1px solid #aabac4;border-radius:4px;padding:3px 6px;font-size:11px;margin:3px 2px}.hold{background:#fff0d8;color:#754516}.part-label{position:absolute;pointer-events:none;background:#ffffffed;border:1px solid #697e8b;padding:2px 4px;font-size:11px;white-space:nowrap}.callout{position:absolute;pointer-events:none;background:#fff;border:2px solid #20313c;padding:6px;font-size:12px;max-width:250px}.license{white-space:pre-wrap;font-size:11px}.orientation{width:100%;background:white}.help{padding:8px;background:#edf2f5}a{color:#165a7b}#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:16px;border:1px solid #bdcbd2;z-index:10}[hidden]{display:none!important}

<header><button id="toggle-controls" aria-expanded="true" aria-label="Toggle controls">☰</button><div><h1 data-en="VPin · Assembly atlas V33.2" data-pt="VPin · Atlas de montagem V33.2"></h1><small data-en="Mechanical review · Manufacturing release blocked" data-pt="Revisão mecânica · Liberação de fabricação bloqueada"></small></div></header>
<div class="layout"><aside>
<div class="row"><button id="lang-en" aria-pressed="true">EN</button><button id="lang-pt" aria-pressed="false">PT-BR</button></div>
<label><span data-en="Palette" data-pt="Paleta"></span><select id="palette"><option value="original" data-en="Original" data-pt="Original"></option><option value="accessible" data-en="Accessible" data-pt="Acessível"></option></select></label>
<div class="actions"><button id="hide-pf" data-en="HIDE PLAYFIELD" data-pt="OCULTAR PLAYFIELD"></button><button id="hide-supports" data-en="HIDE PLAYFIELD + SUPPORTS" data-pt="OCULTAR PLAYFIELD + SUPORTES"></button><button id="interior" data-en="INTERIOR INSPECTION" data-pt="INSPECIONAR INTERIOR"></button><button id="bb-interior" data-en="BACKBOX INTERIOR" data-pt="INTERIOR DO BACKBOX"></button><button id="show-all" data-en="SHOW ALL" data-pt="MOSTRAR TUDO"></button><button id="reset" data-en="RESET VIEW" data-pt="REDEFINIR VISÃO"></button></div>
<label><span data-en="Service / assembly state" data-pt="Estado de serviço / montagem"></span><select id="service-state"></select></label>
<label><span data-en="Camera" data-pt="Câmera"></span><select id="camera-preset"></select></label>
<details id="visibility-panel"><summary data-en="Visibility groups" data-pt="Grupos de visibilidade"></summary><div id="groups"></div></details>
<details id="explode-panel"><summary data-en="Exploded detail" data-pt="Detalhes da vista explodida"></summary>
<label><span data-en="Contents" data-pt="Conteúdo"></span><select id="detail-filter"><option value="both" data-en="WOOD + HARDWARE" data-pt="MADEIRA + FERRAGENS"></option><option value="wood" data-en="WOOD ONLY" data-pt="SOMENTE MADEIRA"></option><option value="hardware" data-en="HARDWARE ONLY" data-pt="SOMENTE FERRAGENS"></option></select></label>
<label><span data-en="Assembly scope" data-pt="Conjunto"></span><select id="scope"><option value="ALL" data-en="ALL" data-pt="TODOS"></option><option value="MAIN CABINET" data-en="MAIN CABINET" data-pt="CAIXA PRINCIPAL"></option><option value="PLAYFIELD" data-en="PLAYFIELD" data-pt="PLAYFIELD"></option><option value="BACKBOX" data-en="BACKBOX" data-pt="BACKBOX"></option></select></label>
<label><span data-en="Detail family" data-pt="Família em detalhe"></span><select id="family-focus"><option value="" data-en="All families" data-pt="Todas as famílias"></option><option value="LegBlock" data-en="Leg-block layers" data-pt="Camadas dos blocos dos pés"></option><option value="IntakeDownBaffle" data-en="Intake-baffle pieces" data-pt="Peças dos defletores de entrada"></option><option value="GlassTopRetainer" data-en="Glass-retainer cap + strip" data-pt="Tampa + tira do retentor de vidro"></option><option value="MonitorStopBlock" data-en="Monitor-stop laminations" data-pt="Laminações dos batentes"></option><option value="CassetteFixedCleat" data-en="Cassette-cleat laminations" data-pt="Laminações dos apoios do cassete"></option></select></label>
<label><span data-en="Separation" data-pt="Separação"></span><input id="distance" type="range" min="0" max="1.7" step="0.05" value="1"></label>
<label><input id="tray" type="checkbox" checked> <span data-en="Unlocated hardware family tray" data-pt="Bandeja de ferragens sem posição definida"></span></label><small data-en="One sample per family. Quantity and location holds remain; the tray is not an installed position." data-pt="Uma amostra por família. Quantidade e posição continuam pendentes; a bandeja não representa instalação."></small>
<button id="frame-visible" class="full" data-en="Frame visible parts" data-pt="Enquadrar peças visíveis"></button></details>
<details><summary data-en="Inspection tools" data-pt="Ferramentas de inspeção"></summary><label><span data-en="Shell opacity" data-pt="Opacidade da estrutura"></span><input id="opacity" type="range" min="0.1" max="1" step="0.05" value="1"></label><label><span data-en="Inspection cut" data-pt="Corte de inspeção"></span><select id="axis"><option value="none" data-en="No cut" data-pt="Sem corte"></option><option value="x">X</option><option value="y">Y</option><option value="z">Z</option></select></label><input id="cut" type="range" min="0" max="100" value="50" aria-label="Cut position"><button id="capture" class="full" data-en="Save image" data-pt="Salvar imagem"></button></details>
<h2 data-en="Part search" data-pt="Buscar peça"></h2><input id="search" class="full" type="search" placeholder="SideL · S2 · BBFloor · M019 · F01 · H11" aria-label="Search part"><div id="parts"></div>
<div id="selection" aria-live="polite"></div><div class="row"><button id="hide" disabled data-en="Hide part" data-pt="Ocultar peça"></button><button id="isolate" disabled data-en="Isolate part" data-pt="Isolar peça"></button><button id="focus" disabled data-en="Focus part" data-pt="Enquadrar peça"></button><button id="clear-selection" data-en="Clear selection" data-pt="Limpar seleção"></button></div><small id="visible-count"></small>
<h2 data-en="Assembly manual" data-pt="Manual de montagem"></h2><select id="manual-stage" aria-label="Manual stage"></select><button id="open-manual" class="full" data-en="Open stage and CAD" data-pt="Abrir etapa e CAD"></button>
<details><summary data-en="Prerequisites and authority" data-pt="Pré-requisitos e autoridade"></summary><p class="help" data-en="Normal fold: rear locks released/parked → doors closed/latched → MAIN PLAYFIELD GLASS removed → MATRIX removed → fold. Backbox glass and cassette stay installed. No routine electronics disconnection." data-pt="Dobra normal: travas traseiras soltas/guardadas → portas fechadas/travadas → VIDRO PRINCIPAL removido → MATRIZ removida → dobrar. Vidro do backbox e cassete permanecem. Sem desconexão elétrica de rotina."></p><p data-en="Rare WPC hinge maintenance may require cassette removal and playfield lift-out. This is not normal folding. Service poses show geometry; physical support/load qualification remains pending." data-pt="A manutenção rara WPC pode exigir remoção do cassete e retirada do playfield. Isso não é dobra normal. Posições de serviço mostram geometria; a validação física de apoio/carga permanece pendente."></p><p data-en="Exploded positions are documentation offsets, not removal trajectories or drilling datums. FRAMEWORK ONLY — no manufacturing release." data-pt="Posições explodidas são deslocamentos de documentação, não trajetórias de retirada nem referências de furação. SOMENTE ROTEIRO — sem liberação de fabricação."></p></details>
