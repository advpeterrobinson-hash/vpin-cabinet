<script>/* Original V34.2 reference comparison UI; CERN-OHL-S-2.0. */
(async()=>{
while(!window.animation333)await new Promise(r=>setTimeout(r,30));
const V=viewer,T=THREE,$=id=>document.getElementById(id),P=document.createElement('details');P.id='v342-study';document.querySelector('aside').append(P);const C=V.data.v342_study,L=(a,b)=>V.language()==='en'?a:b;let state='NOMINAL',active=false;
function mesh(key){const a=V.data.geometry[key],g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(a.vertices.flat(),3));g.setIndex(a.faces.flat());g.computeVertexNormals();return g;}
const optional=V.installed.filter(m=>m.name.startsWith('BB_LowerIntakeFan'));
function show(which){animation333.exit();V.applyState('PLAY');state=which;for(const m of V.installed){if(m.name==='BB_Display32'){m.geometry=mesh(which==='DEPTH80'?C.variants.BB_Generic80TV:m.userData.baseGeometry);m.position.set(0,0,which==='LOW'?-15:which==='HIGH'?15:0);}if(m.name.startsWith('BB_LowerIntakeFan')){m.geometry=mesh(C.variants[m.name]);m.visible=active;}}
$('state-note').textContent=(which==='DEPTH80'?L('80mm body /70mm boss /12mm spacer. 80/55 case FAILS. ','Corpo80 /boss70 /espaçador12mm. Caso80/55 FALHA. '):L('TCL-like reference · ','Referência tipo TCL · '))+C.hold[V.language()];if(which.startsWith('DEPTH')){for(const m of V.installed)if(['BB_SideR','BB_AcrylicFront','BB_AcrylicMask'].includes(m.name))m.visible=false;V.cameraPreset('RIGHT');}V.frame(V.installed.filter(m=>m.visible&&m.name.startsWith('BB_')));}
function render(){P.innerHTML=`<summary>${L('BACKBOX V34.2 STUDIES','ESTUDOS BACKBOX V34.2')}</summary><div class="buttons">${[['LOW','TCL LOW −15','TCL BAIXO −15'],['NOMINAL','TCL NOMINAL','TCL NOMINAL'],['HIGH','TCL HIGH +15','TCL ALTO +15'],['DEPTH75','TCL DEPTH','PROFUNDIDADE TCL'],['DEPTH80','80 mm BODY','CORPO 80 mm']].map(([id,en,pt])=>`<button style="min-height:44px" data-study="${id}">${L(en,pt)}</button>`).join('')}<button style="min-height:44px" id="v342-passive">${L('PASSIVE GRILLES','GRADES PASSIVAS')}</button><button style="min-height:44px" id="v342-active">${L('2 INTAKE + 2 EXHAUST','2 ENTRADAS + 2 EXAUSTORES')}</button></div><p>${C.hold[V.language()]}</p><a href="../backbox-v342/index.html">${L('30 CAD reviews','30 vistas CAD')}</a>`;P.querySelectorAll('[data-study]').forEach(b=>b.onclick=()=>show(b.dataset.study));$('v342-passive').onclick=()=>{active=false;show(state);};$('v342-active').onclick=()=>{active=true;show(state);};}
for(const id of ['lang-en','lang-pt'])$(id).addEventListener('click',()=>setTimeout(render,0));render();window.backbox342={show,get state(){return state;},get active(){return active;}};document.body.dataset.backbox342Ready='true';
})();</script>
